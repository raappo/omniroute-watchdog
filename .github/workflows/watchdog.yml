name: OmniRoute Studio Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-studio-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Ensure Studio is running
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python3 -c "
          from lightning_sdk import Studio
          s = Studio('omniroute-gateway', 'raappo-teamspace', org='raappo-org', create_ok=False)
          print('Current status check, attempting start (safe no-op if already running)...')
          s.start()
          print('Done.')
          "

      - name: Keep workflow alive (prevent 60-day auto-disable)
        run: |
          git config user.name "watchdog-bot"
          git config user.email "watchdog-bot@users.noreply.github.com"
          echo "Last run: $(date)" > .keepalive
          git add .keepalive
          git commit -m "keepalive" || echo "No changes to commit"
          git push
