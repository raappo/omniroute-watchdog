name: OmniRoute Studio Watchdog

on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-studio-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Manage Studio (start if stopped, stop if past safe session limit)
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          import time
          from lightning_sdk import Studio

          TIMESTAMP_FILE = "session_start.txt"
          MAX_SESSION_SECONDS = 9000  # 2h30m — conservative buffer against the real 4h cutoff

          s = Studio('omniroute-gateway', 'raappo-teamspace', org='raappo-org', create_ok=False)

          if os.path.exists(TIMESTAMP_FILE):
              with open(TIMESTAMP_FILE) as f:
                  started_at = float(f.read().strip())
              elapsed = time.time() - started_at
              print(f"Session has been tracked for {elapsed:.0f} seconds")
              if elapsed > MAX_SESSION_SECONDS:
                  print("Past safe session limit — stopping Studio")
                  s.stop()
                  os.remove(TIMESTAMP_FILE)
              else:
                  print("Within safe session window — no action needed")
          else:
              print("No active session tracked — starting Studio and recording timestamp")
              s.start()
              with open(TIMESTAMP_FILE, "w") as f:
                  f.write(str(time.time()))
          EOF

      - name: Commit updated state (prevents 60-day auto-disable too)
        run: |
          git config user.name "watchdog-bot"
          git config user.email "watchdog-bot@users.noreply.github.com"
          git add -A
          git commit -m "watchdog update: $(date)" || echo "No changes to commit"
          git push
