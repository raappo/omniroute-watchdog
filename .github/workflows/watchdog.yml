name: OmniRoute Studio Watchdog

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-studio-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Manage Studio (uses real system uptime, no bookkeeping file needed)
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python3 -c "
          from lightning_sdk import Studio, Status

          MAX_UPTIME_SECONDS = 9000  # 2h30m

          s = Studio('omniroute-gateway', 'raappo-teamspace', org='raappo-org', create_ok=False)

          if s.status == Status.Running:
              result = s.run('cat /proc/uptime')
              uptime_seconds = float(str(result).split()[0])
              print(f'Real system uptime: {uptime_seconds:.0f}s')
              if uptime_seconds > MAX_UPTIME_SECONDS:
                  print('Past safe uptime limit — stopping')
                  s.stop()
              else:
                  print('Within safe window — no action')
          else:
              print('Studio not running — starting')
              s.start()
          "

      - name: Keep workflow alive (prevents 60-day auto-disable)
        run: |
          git config user.name "watchdog-bot"
          git config user.email "watchdog-bot@users.noreply.github.com"
          echo "Last run: $(date)" > .keepalive
          git add .keepalive
          git commit -m "keepalive: $(date)" || echo "No changes to commit"
          git push
